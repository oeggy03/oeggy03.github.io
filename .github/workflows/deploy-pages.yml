name: Verify and deploy portfolio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build the static site
        run: npm run build

      - name: Check metadata and static assets
        run: npm run check:seo

      - name: Start the production preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/portfolio-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/portfolio-preview.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/portfolio-preview.log"
          echo "Production preview did not start in time." >&2
          exit 1

      - name: Configure the Playwright browser path
        run: |
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "BROWSER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Run browser and accessibility checks
        env:
          PORTFOLIO_BASE_URL: http://127.0.0.1:4173/
        run: |
          npm run check:ui

      - name: Preserve the verified site build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependency
        run: npm ci

      - name: Download the verified site build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-site
          path: dist/

      - name: Publish dist to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          npx gh-pages --dist dist --dotfiles
          --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          --user "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          --message "Deploy ${GITHUB_SHA} to GitHub Pages"
          --silent
